name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Pratap38
          outputs: |
            dist/github-snake.svg?palette=github-dark
            dist/github-snake.gif?color_snake=%2300FF41&color_dots=%230D1117%23003300%23006600%2300AA00%2300FF41

      - name: Publish
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
